name: Refresh offers

on:
  schedule:
    - cron: "0 4 * * 1,4"   # Monday and Thursday 04:00 UTC (06:00 Finnish time)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Lidl, Kärkkäinen and Prisma.fi offers
        if: github.event_name != 'push'
        run: python site/fetch_offers.py
      - name: Build the page
        run: |
          python site/build.py
          mkdir -p public
          cp site/standalone.html public/index.html
      - name: Save fetched data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add site/data/offers.json
          git commit -m "Refresh offers $(date -u +%F)" || echo "No changes"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
